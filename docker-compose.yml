services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: astronote
      POSTGRES_USER: astronote
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astronote -d astronote"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: astronote:local
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: postgres://astronote:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/astronote
      TRUST_PROXY_HOPS: "1"
      ATTACHMENT_STORAGE_PATH: /data/attachments
    volumes:
      - attachment_data:/data/attachments
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    command: ["caddy", "reverse-proxy", "--from", "${APP_DOMAIN:?Set APP_DOMAIN in .env}", "--to", "app:3001"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  attachment_data:
  caddy_data:
  caddy_config:
