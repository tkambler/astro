services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: astronote
      POSTGRES_USER: astronote
      POSTGRES_PASSWORD: astronote-dev
    ports:
      - "127.0.0.1::5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astronote -d astronote"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  dev_postgres_data:
